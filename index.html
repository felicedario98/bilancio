<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Finanze</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f2f2f7">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
       /* STILI GENERALI */
       body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f7; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
       .container { max-width: 600px; margin: 0 auto; padding: 15px; background: #fff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
       
       /* TABS */
       .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
       .tabs::-webkit-scrollbar { display: none; }
       .tab-btn { padding: 8px 12px; border: none; background: #e5e5ea; border-radius: 20px; font-size: 13px; font-weight: 600; color: #8e8e93; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
       .active-entrate { background: #34c759; color: white; }
       .active-spese { background: #ff3b30; color: white; }
       .active-risparmi { background: #007aff; color: white; }
       .active-trasferimenti { background: #5856d6; color: white; }
       .active-macchina { background: #ff9500; color: white; }

       /* FORM */
       .form-group { margin-bottom: 15px; }
       label { display: block; font-size: 12px; color: #8e8e93; margin-bottom: 5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
       input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e5e5ea; border-radius: 10px; font-size: 16px; background: #f2f2f7; box-sizing: border-box; -webkit-appearance: none; }
       input:focus, select:focus, textarea:focus { outline: none; border-color: #007aff; background: #fff; }
       .row { display: flex; gap: 10px; }
       .col { flex: 1; }
       
       /* BOTTONI */
       .save-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; color: white; margin-top: 10px; cursor: pointer; transition: transform 0.1s; }
       .save-btn:active { transform: scale(0.98); }
       .save-btn:disabled { opacity: 0.7; cursor: not-allowed; }
       .btn-entrate { background: #34c759; }
       .btn-spese { background: #ff3b30; }
       .btn-risparmi { background: #007aff; }
       .btn-trasferimenti { background: #5856d6; }
       .btn-versa { background: #34c759; margin-right: 5px; }
       .btn-preleva { background: #ff3b30; margin-left: 5px; }
       .btn-macchina-primo { background: #8e8e93; margin-right: 5px; }
       .btn-macchina-std { background: #ff9500; margin-left: 5px; }

       /* UTILS */
       .hidden { display: none !important; }
       .section-title { font-size: 14px; font-weight: bold; color: #333; margin: 20px 0 10px 0; border-bottom: 1px solid #eee; padding-bottom: 5px; }
       #status { margin-top: 15px; text-align: center; font-weight: 500; font-size: 14px; min-height: 20px; }
       .input-euro { font-weight: bold; color: #333; }

       /* --- NUOVI STILI PER LISTA E TABELLA --- */
       .table-container { margin-top: 15px; overflow-x: auto; }
       table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; border-radius: 8px; overflow: hidden; }
       th { background: #e0e0e0; padding: 10px; text-align: left; font-size: 11px; text-transform: uppercase; color: #555; }
       td { padding: 10px; border-bottom: 1px solid #eee; }
       tr:last-child td { border-bottom: none; }
       
       /* Correzione visualizzazione Importo */
       .col-importo { 
           font-weight: bold; 
           text-align: right; 
           color: #333; 
           white-space: nowrap; /* Non va a capo */
           font-size: 12px; 
       }
       
       .badge-rimborso { background: #FFF3CD; color: #856404; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; border: 1px solid #FFEeba; display: inline-block; margin-top: 2px; }
       .filter-row { display: flex; gap: 10px; margin-bottom: 10px; }
       .filter-row select { flex: 1; padding: 8px; font-size: 14px; }
       #loader-lista { text-align: center; font-size: 12px; color: #888; margin-top: 10px; font-style: italic; }
       .empty-msg { text-align: center; color: #999; padding: 20px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
      <div class="tabs">
        <button class="tab-btn active-entrate" onclick="switchTab('entrate')">ENTRATE</button>
        <button class="tab-btn" onclick="switchTab('spese')">SPESE</button>
        <button class="tab-btn" onclick="switchTab('lista')">LISTA</button>
        <button class="tab-btn" onclick="switchTab('macchina')">MACCHINA</button>
        <button class="tab-btn" onclick="switchTab('risparmi')">RISP.</button>
        <button class="tab-btn" onclick="switchTab('trasferimenti')">GIRO.</button>
      </div>

      <form id="mainForm">
        
        <div id="area-lista" class="hidden">
           <div class="filter-row">
              <select id="filtroMese" onchange="renderTable()">
                 </select>
              <select id="filtroAnno" onchange="renderTable()">
                 </select>
           </div>
           
           <div id="loader-lista" class="hidden">Controllo aggiornamenti...</div>

           <div class="table-container">
              <table id="tabellaSpese">
                 <thead>
                    <tr>
                       <th style="width:30px">ID</th>
                       <th style="width:70px">Data</th>
                       <th>Dettagli</th>
                       <th style="text-align:right">Importo</th>
                    </tr>
                 </thead>
                 <tbody id="tbodySpese"></tbody>
              </table>
           </div>
        </div>

        <div id="area-input">
            
            <input type="hidden" id="idModifica">

            <div class="row" id="row-ids">
              <div class="col form-group">
                <label>ID Op.</label>
                <input type="text" id="idAuto" readonly style="background:#eee;">
              </div>
              <div class="col form-group" id="group-idRif">
                <label>Rif. Spesa</label>
                <input type="text" id="idRif">
              </div>
            </div>

            <div class="form-group">
              <label>Data</label>
              <input type="date" id="data" required>
            </div>

            <div id="area-macchina" class="hidden">
               <div class="form-group">
                  <label>Macchina</label>
                  <select id="macchina"></select>
               </div>
               <div class="row">
                  <div class="col form-group">
                     <label>KM</label>
                     <input type="text" inputmode="decimal" id="kmQuadro">
                  </div>
                  <div class="col form-group">
                     <label>€/Litro</label>
                     <input type="text" inputmode="decimal" id="prezzoLitro">
                  </div>
               </div>
            </div>

            <div id="area-categorie">
                <div class="form-group">
                  <label>Categoria</label>
                  <select id="categoria" onchange="onCategoryChange()">
                    <option value="" disabled selected>Caricamento...</option>
                  </select>
                  <input type="hidden" id="categoriaText">
                </div>
                <div class="form-group" id="group-subcat">
                  <label>Sottocategoria</label>
                  <select id="sottocategoria"><option>--</option></select>
                </div>
            </div>

            <div class="form-group">
              <label>Importo (€)</label>
              <input type="text" inputmode="decimal" id="importo" class="input-euro" placeholder="0,00" required>
            </div>

            <div class="form-group hidden" id="group-rimborso">
              <label>Rimborso?</label>
              <select id="daRimborsare">
                 <option value="NO" selected>No</option>
                 <option value="SI">Si</option>
              </select>
            </div>

            <div id="area-dettagli">
                <div class="section-title" id="title-mittente">Dettagli</div>
                <div class="row">
                  <div class="col form-group">
                    <label>Conto</label>
                    <select id="conto" required></select>
                  </div>
                  <div class="col form-group">
                    <label>Utente</label>
                    <select id="utente"></select>
                  </div>
                </div>
            </div>

            <div id="area-beneficiario" class="hidden">
                <div class="section-title">Destinatario</div>
                <div class="row">
                  <div class="col form-group">
                    <label>Conto Ben.</label>
                    <select id="contoBen"></select>
                  </div>
                  <div class="col form-group">
                    <label>Beneficiario</label>
                    <select id="beneficiario"></select>
                  </div>
                </div>
            </div>

            <div class="form-group" id="group-note">
              <label>Note</label>
              <textarea id="note" rows="2"></textarea>
            </div>
        </div>

        <div id="btn-group-main">
           <button type="button" onclick="submitForm(false)" id="btnSave" class="save-btn btn-entrate">Salva</button>
        </div>
        <div id="btn-group-risparmi" class="row hidden">
           <button type="button" onclick="submitForm(true)" class="save-btn btn-versa col">VERSA (+)</button>
           <button type="button" onclick="submitForm(false)" class="save-btn btn-preleva col">PRELEVA (-)</button>
        </div>
        <div id="btn-group-macchina" class="row hidden">
           <button type="button" onclick="submitForm(true)" class="save-btn btn-macchina-primo col">Primo (0)</button>
           <button type="button" onclick="submitForm(false)" class="save-btn btn-macchina-std col">Riforn. (+1)</button>
        </div>

        <div id="status"></div>
      </form>
    </div>

    <script>
        // ⚠️ INCOLLA QUI SOTTO IL TUO LINK DI GOOGLE SCRIPT (quello che finisce con /exec)
        const API_URL = "https://script.google.com/macros/s/AKfycbzTm8ZyXojBbcjyYFwpYbCVxYc7q_U99ZaLlG-O7A-2Esd2_i_guZYaM86Q2CRFL6wWKw/exec"; 
    </script>
    
    <script src="app.js"></script>
    
    </body>
</html>
